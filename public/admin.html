<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Paneli - KaraKartal Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#2C2D30] text-[#F4F1EA] h-screen flex flex-col">

  <!-- Üst Bar -->
  <div class="h-16 bg-[#1E1F22] border-b border-[#383A3F] flex items-center justify-between px-8">
    <h1 class="text-xl font-bold text-[#D7CCC8]">🛡️ Moderasyon ve Ban Paneli</h1>
    <a href="chat.html" class="text-sm text-[#949BA4] hover:text-[#F4F1EA] transition">Sohbete Dön</a>
  </div>

  <!-- İçerik -->
  <div class="flex-1 p-8 overflow-y-auto space-y-8">
    
    <!-- Ban Atma Formu -->
    <div class="bg-[#1E1F22] p-6 rounded-lg border border-[#383A3F] max-w-xl">
      <h2 class="text-lg font-semibold mb-4 text-[#D7CCC8]">Manuel Ban At</h2>
      <form id="banForm" class="space-y-4">
        <div>
          <label class="block text-sm text-[#949BA4] mb-1">IP Adresi</label>
          <input type="text" id="banIpInput" placeholder="Örn: 192.168.1.34" required class="w-full bg-[#2C2D30] border border-[#383A3F] rounded px-3 py-2 text-[#F4F1EA] focus:outline-none">
        </div>
        <div>
          <label class="block text-sm text-[#949BA4] mb-1">Ban Süresi</label>
          <select id="banDuration" class="w-full bg-[#2C2D30] border border-[#383A3F] rounded px-3 py-2 text-[#F4F1EA] focus:outline-none">
            <option value="">Kalıcı Ban (Süresiz)</option>
            <option value="60">1 Saat</option>
            <option value="1440">24 Saat (1 Gün)</option>
            <option value="10080">1 Hafta</option>
          </select>
        </div>
        <button type="submit" class="bg-red-500/20 text-red-400 font-semibold px-4 py-2 rounded hover:bg-red-500/30 transition text-sm">Banı Yapıştır</button>
      </form>
    </div>

    <!-- Aktif Ban Listesi -->
    <div>
      <h2 class="text-lg font-semibold mb-4 text-[#D7CCC8]">Aktif Banlı IP'ler</h2>
      <div class="bg-[#1E1F22] rounded-lg border border-[#383A3F] overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-[#383A3F] text-[#949BA4] text-sm">
              <th class="p-4">IP Adresi</th>
              <th class="p-4">Bitiş Süresi</th>
              <th class="p-4">İşlemler</th>
            </tr>
          </thead>
          <tbody id="banListTable">
            <!-- JavaScript ile dinamik dolacak -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Örnek Ban Kaldırma Fonksiyonu
    function unbanUser(banId) {
      if(confirm("Bu kullanıcının banını kaldırmak istediğine emin misin kanka?")) {
        fetch('/api/unban-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ banId })
        })
        .then(res => res.json())
        .then(data => {
          alert(data.message);
          location.reload();
        });
      }
    }
  </script>
</body>
</html>
