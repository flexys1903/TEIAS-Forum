<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEİAŞ Chat Platformu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f1115; color: #e1e1e6; height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar / Odalar Alanı */
        .sidebar { width: 260px; background-color: #15181e; border-right: 1px solid #222631; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 1.1rem; font-weight: bold; color: #fff; border-bottom: 1px solid #222631; display: flex; align-items: center; gap: 10px; }
        .channels { padding: 15px; flex: 1; overflow-y: auto; }
        .channel-title { font-size: 0.75rem; text-transform: uppercase; color: #72767d; margin-bottom: 10px; font-weight: bold; letter-spacing: 0.5px; }
        .channel-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; color: #969ba5; font-size: 0.95rem; transition: all 0.2s ease; margin-bottom: 4px; }
        .channel-item:hover, .channel-item.active { background-color: #20242d; color: #fff; transform: translateX(4px); }

        /* Ana Sohbet Alanı */
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #181b22; }
        .chat-header { padding: 15px 25px; background-color: #1a1d24; border-bottom: 1px solid #222631; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { font-size: 1rem; color: #fff; }
        .status-badge { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #3ba55d; background: rgba(59, 165, 93, 0.1); padding: 4px 10px; border-radius: 12px; }

        /* Mesajlar Kutusu ve Animasyonlar */
        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message { background: #20242d; padding: 12px 16px; border-radius: 8px; max-width: 75%; word-break: break-word; animation: fadeIn 0.3s ease forwards; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .message.user { background: #3b82f6; color: white; align-self: flex-end; animation: fadeIn 0.3s ease forwards; }
        .message .author { font-size: 0.75rem; color: #a0aec0; margin-bottom: 4px; font-weight: 600; }
        .message.user .author { color: #dbeafe; }

        /* Alt Yazı Alanı */
        .input-container { padding: 20px; background-color: #181b22; }
        .input-wrapper { display: flex; background-color: #121418; border: 1px solid #2a2f3d; border-radius: 8px; padding: 8px 12px; transition: border-color 0.2s; }
        .input-wrapper:focus-within { border-color: #3b82f6; }
        .input-wrapper input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 0.95rem; padding: 4px; }
        .input-wrapper button { background-color: #3b82f6; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s, transform 0.1s; }
        .input-wrapper button:hover { background-color: #2563eb; }
        .input-wrapper button:active { transform: scale(0.96); }

        /* Mobil Uyum */
        @media(max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <!-- Sol Menü / Odalar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span>🦅</span> TEİAŞ Hub
        </div>
        <div class="channels">
            <div class="channel-title">Sohbet Kanalları</div>
            <div class="channel-item active"># genel-sohbet</div>
            <div class="channel-item"># duyurular</div>
            <div class="channel-item"># projeler</div>
        </div>
    </div>

    <!-- Sağ Ana Ekran -->
    <div class="chat-area">
        <div class="chat-header">
            <h2 id="current-channel-title"># genel-sohbet</h2>
            <div class="status-badge">
                <span style="width: 8px; height: 8px; background: #3ba55d; border-radius: 50%;"></span> Bağlı
            </div>
        </div>

        <div id="chat-messages">
            <div class="message">
                <div class="author">Sistem</div>
                <div>Tek sayfalama başarıyla tamamlandı kanka! Tasarım ve animasyonlar aktif.</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="#genel-sohbet kanalına mesaj yaz..." autofocus>
                <button onclick="sendMessage()">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(!text) return;

            const chatBox = document.getElementById('chat-messages');
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            msgDiv.innerHTML = `<div class="author">Sen</div><div>${escapeHtml(text)}</div>`;
            
            chatBox.appendChild(msgDiv);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
