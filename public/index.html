<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEİAŞ Chat Platformu</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f1115; color: #e1e1e6; height: 100vh; display: flex; overflow: hidden; }

        /* Auth Ekranı */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .auth-card { background: #181b22; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #222631; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .auth-card h2 { color: #fff; margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
        .auth-card input { width: 100%; background: #121418; border: 1px solid #2a2f3d; padding: 12px; border-radius: 8px; color: #fff; margin-bottom: 15px; outline: none; }
        .auth-card input:focus { border-color: #3b82f6; }
        .auth-card button { width: 100%; background: #3b82f6; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .auth-card button:hover { background: #2563eb; }
        .auth-switch { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #969ba5; cursor: pointer; }
        .auth-switch:hover { color: #fff; }

        /* Ana Uygulama */
        .sidebar { width: 260px; background-color: #15181e; border-right: 1px solid #222631; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 1.1rem; font-weight: bold; color: #fff; border-bottom: 1px solid #222631; display: flex; justify-content: space-between; align-items: center; }
        .channels { padding: 15px; flex: 1; overflow-y: auto; }
        .channel-title { font-size: 0.75rem; text-transform: uppercase; color: #72767d; margin-bottom: 10px; font-weight: bold; letter-spacing: 0.5px; }
        .channel-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; color: #969ba5; font-size: 0.95rem; transition: all 0.2s ease; margin-bottom: 4px; }
        .channel-item.active { background-color: #20242d; color: #fff; }
        
        .user-panel { padding: 15px; background: #121418; border-top: 1px solid #222631; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .user-panel button { background: #ef4444; border: none; color: #fff; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #181b22; }
        .chat-header { padding: 15px 25px; background-color: #1a1d24; border-bottom: 1px solid #222631; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { font-size: 1rem; color: #fff; }

        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message { background: #20242d; padding: 12px 16px; border-radius: 8px; max-width: 75%; word-break: break-word; animation: fadeIn 0.3s ease forwards; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .message .author { font-size: 0.75rem; color: #3b82f6; margin-bottom: 4px; font-weight: 600; }
        .message img { max-width: 100%; border-radius: 6px; margin-top: 8px; display: block; }

        .input-container { padding: 20px; background-color: #181b22; }
        .input-wrapper { display: flex; align-items: center; background-color: #121418; border: 1px solid #2a2f3d; border-radius: 8px; padding: 6px 12px; gap: 10px; }
        .input-wrapper:focus-within { border-color: #3b82f6; }
        .input-wrapper input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 0.95rem; padding: 4px; }
        .upload-btn { background: transparent; border: none; color: #969ba5; cursor: pointer; font-size: 1.2rem; transition: color 0.2s; }
        .upload-btn:hover { color: #fff; }
        .input-wrapper button.send { background-color: #3b82f6; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        
        @media(max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body>

    <!-- Giriş / Kayıt Ol Modal -->
    <div id="auth-modal">
        <div class="auth-card">
            <h2 id="auth-title">Giriş Yap</h2>
            <input type="email" id="auth-email" placeholder="E-posta adresin">
            <input type="password" id="auth-password" placeholder="Şifren">
            <button onclick="handleAuth()" id="auth-btn">Giriş Yap</button>
            <div class="auth-switch" onclick="toggleAuthMode()" id="auth-switch-text">Hesabın yok mu? Kayıt ol</div>
        </div>
    </div>

    <!-- Sol Menü -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span>🦅</span> TEİAŞ Hub
        </div>
        <div class="channels">
            <div class="channel-title">Sohbet Kanalları</div>
            <div class="channel-item active"># genel-sohbet</div>
        </div>
        <div class="user-panel">
            <span id="user-display">Yükleniyor...</span>
            <button onclick="logout()">Çıkış</button>
        </div>
    </div>

    <!-- Sohbet Alanı -->
    <div class="chat-area">
        <div class="chat-header">
            <h2># genel-sohbet</h2>
            <span style="font-size: 0.85rem; color: #3ba55d;">● Canlı</span>
        </div>

        <div id="chat-messages"></div>

        <div class="input-container">
            <div class="input-wrapper">
                <label class="upload-btn" title="Resim Yükle">
                    📷 <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="uploadImage(this)">
                </label>
                <input type="text" id="msgInput" placeholder="Mesaj gönder..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send" onclick="sendMessage()">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        let supabase;
        let currentUser = null;
        let isSignUp = false;

        async function init() {
            const res = await fetch('/api/config');
            const config = await res.json();
            
            if (!config.SUPABASE_URL || !config.SUPABASE_KEY) {
                alert("Supabase anahtarları eksik!");
                return;
            }

            supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_KEY);

            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-modal').style.display = 'none';
                document.getElementById('user-display').textContent = currentUser.email.split('@')[0];
                loadMessages();
                subscribeRealtime();
            }
        }

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').textContent = isSignUp ? "Kayıt Ol" : "Giriş Yap";
            document.getElementById('auth-btn').textContent = isSignUp ? "Kayıt Ol" : "Giriş Yap";
            document.getElementById('auth-switch-text').textContent = isSignUp ? "Zaten hesabın var mı? Giriş yap" : "Hesabın yok mu? Kayıt ol";
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if(!email || !password) return alert("Alanları doldur kanka!");

            let result;
            if (isSignUp) {
                result = await supabase.auth.signUp({ email, password });
                if(result.error) alert(result.error.message);
                else alert("Kayıt başarılı! Giriş yapabilirsin.");
            } else {
                result = await supabase.auth.signInWithPassword({ email, password });
                if(result.error) {
                    alert(result.error.message);
                } else {
                    location.reload();
                }
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function loadMessages() {
            const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
            if (error) return console.error(error);
            
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            data.forEach(msg => appendMessage(msg));
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function subscribeRealtime() {
            supabase.channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    appendMessage(payload.new);
                    const chatBox = document.getElementById('chat-messages');
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .subscribe();
        }

        async function sendMessage(imageUrl = null) {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text && !imageUrl) return;

            const { error } = await supabase.from('messages').insert([{
                user_email: currentUser.email.split('@')[0],
                content: text,
                image_url: imageUrl
            }]);

            if (error) alert(error.message);
            else input.value = '';
        }

        async function uploadImage(input) {
            const file = input.files[0];
            if (!file) return;

            const fileName = `${Date.now()}_${file.name}`;
            const { data, error } = await supabase.storage.from('chat-images').upload(fileName, file);

            if (error) {
                alert("Resim yüklenemedi: " + error.message);
                return;
            }

            const { data: publicURL } = supabase.storage.from('chat-images').getPublicUrl(fileName);
            sendMessage(publicURL.publicUrl);
        }

        function appendMessage(msg) {
            const chatBox = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            let html = `<div class="author">${msg.user_email}</div>`;
            if (msg.content) html += `<div>${escapeHtml(msg.content)}</div>`;
            if (msg.image_url) html += `<img src="${msg.image_url}" alt="Yüklenen Görsel">`;
            
            msgDiv.innerHTML = html;
            chatBox.appendChild(msgDiv);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        init();
    </script>
</body>
</html>
