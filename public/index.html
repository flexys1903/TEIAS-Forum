<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEİAŞ Quantum Core // Beige & Gray Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #141416;
            --surface: #1c1c20;
            --surface-hover: #26262c;
            --border: rgba(212, 181, 157, 0.15);
            --beige-primary: #d4b59d;
            --beige-light: #f5f0eb;
            --beige-dark: #b8977e;
            --text-main: #f5f0eb;
            --text-muted: #a39b93;
            --gray-subtle: #2b2b33;
            --danger: #d97706;
            --success: #65a30d;
            --admin-gold: #d4b59d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        /* Auth Modal */
        #auth-modal { position: fixed; inset: 0; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .auth-container { width: 100%; max-width: 420px; padding: 35px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); position: relative; overflow: hidden; }
        .auth-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--beige-primary), var(--beige-dark)); }
        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-header h1 { font-size: 1.6rem; font-weight: 700; color: var(--beige-light); margin-bottom: 6px; }
        .auth-header p { color: var(--text-muted); font-size: 0.85rem; }
        
        .input-group { margin-bottom: 16px; }
        .input-group input { width: 100%; background: var(--gray-subtle); border: 1px solid var(--border); padding: 14px 16px; border-radius: 12px; color: var(--beige-light); font-size: 1rem; outline: none; transition: border-color 0.2s; }
        .input-group input:focus { border-color: var(--beige-primary); }
        
        .btn-primary { width: 100%; background: linear-gradient(135deg, var(--beige-primary), var(--beige-dark)); color: #141416; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 5px; transition: opacity 0.2s; }
        .btn-primary:active { opacity: 0.9; }
        
        .auth-switch-btn { width: 100%; background: rgba(255,255,255,0.02); border: 1px solid var(--border); color: var(--text-muted); padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 500; cursor: pointer; margin-top: 20px; text-align: center; display: block; }
        .auth-switch-btn:active { background: rgba(212, 181, 157, 0.1); color: var(--beige-light); }

        /* Ana Uygulama Yapısı */
        .app-wrapper { display: flex; width: 100vw; height: 100vh; opacity: 0; transition: opacity 0.4s ease; }
        .app-wrapper.visible { opacity: 1; }

        /* Sidebar */
        .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        .brand-box { padding: 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .brand-logo { width: 38px; height: 38px; background: var(--gray-subtle); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .brand-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .brand-info h2 { font-size: 1rem; font-weight: 700; color: var(--beige-light); }
        .brand-info span { font-size: 0.7rem; color: var(--beige-primary); font-family: 'JetBrains Mono', monospace; }
        
        .nav-section { padding: 15px; flex: 1; overflow-y: auto; }
        .nav-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; padding-left: 8px; }
        .nav-item { padding: 10px 14px; border-radius: 8px; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .nav-item.active { background: rgba(212, 181, 157, 0.12); color: var(--beige-light); border-left: 3px solid var(--beige-primary); }

        .admin-panel-btn { margin: 15px; background: rgba(212, 181, 157, 0.08); border: 1px solid rgba(212, 181, 157, 0.2); color: var(--beige-primary); padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: none; text-align: center; }

        .user-footer { padding: 15px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .user-meta { display: flex; align-items: center; gap: 10px; }
        .user-avatar-container { position: relative; width: 36px; height: 36px; cursor: pointer; }
        .user-avatar { width: 36px; height: 36px; background: var(--gray-subtle); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: var(--beige-primary); overflow: hidden; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-edit-badge { position: absolute; bottom: 0; right: 0; background: var(--beige-primary); color: #141416; font-size: 0.55rem; width: 14px; height: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; border: 1px solid var(--bg-deep); }
        
        .user-name { font-size: 0.85rem; font-weight: 600; color: var(--beige-light); max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .logout-btn { background: rgba(217, 119, 6, 0.1); border: 1px solid rgba(217, 119, 6, 0.2); color: var(--beige-primary); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Workspace & Chat */
        .workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg-deep); position: relative; }
        .workspace-header { padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .workspace-title h3 { font-size: 1rem; font-weight: 600; color: var(--beige-light); }
        .workspace-title p { font-size: 0.75rem; color: var(--text-muted); }

        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message-card { display: flex; gap: 12px; max-width: 85%; }
        .message-card.self { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 10px; background: var(--gray-subtle); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--beige-primary); flex-shrink: 0; font-size: 0.85rem; overflow: hidden; }
        .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .message-card.self .msg-avatar { background: var(--beige-primary); color: #141416; }
        .msg-content-wrapper { display: flex; flex-direction: column; gap: 4px; }
        .message-card.self .msg-content-wrapper { align-items: flex-end; }
        .msg-meta { font-size: 0.7rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        
        .msg-bubble { background: var(--surface); border: 1px solid var(--border); padding: 12px 16px; border-radius: 14px; color: var(--text-main); font-size: 0.9rem; word-break: break-word; }
        .message-card.self .msg-bubble { background: var(--beige-primary); color: #141416; border-color: var(--beige-primary); font-weight: 500; }
        .msg-bubble img { max-width: 260px; max-height: 200px; border-radius: 8px; margin-top: 8px; display: block; cursor: pointer; }

        /* Input Dock */
        .input-dock { padding: 16px 20px; background: var(--surface); border-top: 1px solid var(--border); }
        .input-box { display: flex; align-items: center; background: var(--gray-subtle); border: 1px solid var(--border); border-radius: 14px; padding: 6px 10px; gap: 10px; }
        .attach-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; }
        .input-box input[type="text"] { flex: 1; background: transparent; border: none; color: var(--beige-light); outline: none; font-size: 0.95rem; padding: 6px; }
        .send-btn { background: var(--beige-primary); border: none; color: #141416; padding: 10px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.9rem; transition: opacity 0.2s; }
        .send-btn:active { opacity: 0.85; }
        .uploading-indicator { font-size: 0.75rem; color: var(--beige-primary); display: none; font-family: 'JetBrains Mono', monospace; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <div id="auth-modal">
        <div class="auth-container" id="auth-card">
            <div class="auth-header">
                <h1>Bağlantı Kuruluyor...</h1>
                <p>Sunucu yapılandırması alınıyor</p>
            </div>
        </div>
    </div>

    <div class="app-wrapper" id="appWrapper">
        <div class="sidebar">
            <div class="brand-box">
                <div class="brand-logo">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/ea/TE%C4%B0A%C5%9E_logo.svg" alt="TEİAŞ Logo">
                </div>
                <div class="brand-info">
                    <h2>TEİAŞ Core</h2>
                    <span>Canlı Ağ</span>
                </div>
            </div>
            <div class="nav-section">
                <div class="nav-label">Kanallar</div>
                <div class="nav-item active"># quantum-genel</div>
            </div>
            
            <div id="adminBtn" class="admin-panel-btn" onclick="openAdminPanel()">⚙️ Admin Paneli</div>

            <div class="user-footer">
                <div class="user-meta">
                    <div class="user-avatar-container" onclick="document.getElementById('avatarFileInput').click()" title="Profil Fotoğrafını Değiştir">
                        <div class="user-avatar" id="userAvatarBox">U</div>
                        <div class="avatar-edit-badge">📷</div>
                        <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="uploadProfileAvatar(this)">
                    </div>
                    <div class="user-name" id="userDisplayName">Bağlanıyor...</div>
                </div>
                <button class="logout-btn" onclick="logout()" title="Çıkış Yap">⏻</button>
            </div>
        </div>

        <div class="workspace">
            <div class="workspace-header">
                <div class="workspace-title">
                    <h3># quantum-genel</h3>
                    <p>Uçtan uca şifreli kanal</p>
                </div>
            </div>

            <div id="chat-messages"></div>

            <div class="input-dock">
                <div class="input-box">
                    <label class="attach-btn" title="Resim Yükle">
                        📎
                        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="uploadFile(this)">
                    </label>
                    <span class="uploading-indicator" id="uploadStatus">Yükleniyor...</span>
                    <input type="text" id="msgInput" placeholder="Mesajını ilet..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">İlet</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var supabase;
        var currentUser = null;
        var currentUsername = "";
        var currentUserAvatar = "";
        var isLoginMode = true; 
        var ADMIN_USERNAME = "utku"; 

        async function init() {
            try {
                var res = await fetch('/api/config');
                var config = await res.json();
                
                if (!config.SUPABASE_URL || !config.SUPABASE_KEY) {
                    alert("HATA: Render Environment Variables içinde SUPABASE_URL veya SUPABASE_KEY eksik!");
                    return;
                }

                supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_KEY);
                renderAuthCard();

                var sessionRes = await supabase.auth.getSession();
                if (sessionRes.data && sessionRes.data.session) {
                    await fetchUserProfile(sessionRes.data.session.user);
                }
            } catch (err) {
                alert("Kritik Bağlantı Hatası: " + err.message);
            }
        }

        function renderAuthCard() {
            var card = document.getElementById('auth-card');
            if (!card) return;
            
            var html = '';
            if (isLoginMode) {
                html += '<div class="auth-header"><h1>Giriş Yap</h1><p>TEİAŞ Quantum Ağına Bağlan</p></div>';
                html += '<div class="input-group"><input type="text" id="auth-username" placeholder="Kullanıcı Adı" autocapitalize="none"></div>';
                html += '<div class="input-group"><input type="password" id="auth-password" placeholder="Şifre"></div>';
                html += '<button class="btn-primary" onclick="handleAuthAction()">Giriş Yap</button>';
                html += '<button type="button" class="auth-switch-btn" onclick="toggleMode()">Hesabın yok mu? Kayıt ol ⚡</button>';
            } else {
                html += '<div class="auth-header"><h1>Hesap Oluştur</h1><p>Benzersiz kullanıcı adı, e-posta ve şifre belirle</p></div>';
                html += '<div class="input-group"><input type="text" id="auth-username" placeholder="Kullanıcı Adı (Benzersiz)" autocapitalize="none"></div>';
                html += '<div class="input-group"><input type="email" id="auth-email" placeholder="E-posta Adresin"></div>';
                html += '<div class="input-group"><input type="password" id="auth-password" placeholder="Şifre"></div>';
                html += '<button class="btn-primary" onclick="handleAuthAction()">Kayıt Ol ve Başla</button>';
                html += '<button type="button" class="auth-switch-btn" onclick="toggleMode()">Zaten hesabın var mı? Giriş yap ⚡</button>';
            }
            card.innerHTML = html;
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            renderAuthCard();
        }

        async function handleAuthAction() {
            var usernameInput = document.getElementById('auth-username');
            var passwordInput = document.getElementById('auth-password');
            
            if(!usernameInput || !passwordInput) return;
            
            var username = usernameInput.value.trim().toLowerCase();
            var password = passwordInput.value.trim();

            if(!username || !password) {
                alert("Kullanıcı adı ve şifreni eksiksiz gir kanka!");
                return;
            }

            if (isLoginMode) {
                var profileRes = await supabase.from('profiles').select('email').eq('username', username).single();
                
                if (profileRes.error || !profileRes.data) {
                    alert("Giriş Hatası: Bu kullanıcı adı bulunamadı!");
                    return;
                }

                var result = await supabase.auth.signInWithPassword({ 
                    email: profileRes.data.email, 
                    password: password 
                });

                if(result.error) {
                    alert("Giriş Hatası: Şifre hatalı!");
                } else {
                    await fetchUserProfile(result.data.user);
                }
            } else {
                var emailInput = document.getElementById('auth-email');
                if(!emailInput) return;
                var email = emailInput.value.trim();

                if(!email) {
                    alert("Lütfen geçerli bir e-posta adresi gir kanka!");
                    return;
                }

                var checkRes = await supabase.from('profiles').select('username').eq('username', username).single();
                if (checkRes.data) {
                    alert("Kayıt Hatası: Bu kullanıcı adı zaten başkası tarafından alınmış kanka!");
                    return;
                }

                var resultUp = await supabase.auth.signUp({ 
                    email: email, 
                    password: password,
                    options: {
                        data: { username: username }
                    }
                });

                if(resultUp.error) {
                    alert("Kayıt Hatası: " + resultUp.error.message);
                } else {
                    if (resultUp.data.session) {
                        await fetchUserProfile(resultUp.data.user);
                    } else {
                        alert("Kayıt başarılı! Şimdi giriş yapabilirsin.");
                        isLoginMode = true;
                        renderAuthCard();
                    }
                }
            }
        }

        async function fetchUserProfile(user) {
            currentUser = user;
            
            var { data, error } = await supabase.from('profiles').select('username, avatar_url').eq('id', user.id).single();
            if (data) {
                currentUsername = data.username;
                currentUserAvatar = data.avatar_url || "";
            } else {
                currentUsername = user.email.split('@')[0];
                currentUserAvatar = "";
            }

            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('appWrapper').classList.add('visible');
            
            document.getElementById('userDisplayName').textContent = currentUsername;
            
            var avatarBox = document.getElementById('userAvatarBox');
            if (currentUserAvatar) {
                avatarBox.innerHTML = '<img src="' + currentUserAvatar + '" alt="PP">';
            } else {
                avatarBox.textContent = currentUsername.charAt(0).toUpperCase();
            }
            
            if (currentUsername.toLowerCase() === ADMIN_USERNAME.toLowerCase()) {
                document.getElementById('adminBtn').style.display = 'block';
            }

            loadMessages();
            subscribeRealtime();
        }

        async function uploadProfileAvatar(inputElement) {
            var file = inputElement.files[0];
            if (!file) return;

            var fileName = 'avatar_' + currentUser.id + '_' + Date.now() + '_' + file.name;
            var uploadRes = await supabase.storage.from('chat-images').upload(fileName, file);

            if (uploadRes.error) {
                alert("PP yükleme hatası: " + uploadRes.error.message);
                return;
            }

            var urlRes = supabase.storage.from('chat-images').getPublicUrl(fileName);
            if (urlRes && urlRes.data) {
                currentUserAvatar = urlRes.data.publicUrl;
                
                // Profiles tablosunu güncelle
                await supabase.from('profiles').update({ avatar_url: currentUserAvatar }).eq('id', currentUser.id);

                // Sol alttaki avatarı güncelle
                var avatarBox = document.getElementById('userAvatarBox');
                avatarBox.innerHTML = '<img src="' + currentUserAvatar + '" alt="PP">';
                
                alert("Profil fotoğrafın güncellendi kanka! ⚡");
            }
            inputElement.value = '';
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function loadMessages() {
            var res = await supabase.from('messages').select('*').order('created_at', { ascending: true });
            if (res.error) return;
            
            var chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            if(res.data) {
                res.data.forEach(function(msg) {
                    appendMessage(msg);
                });
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function subscribeRealtime() {
            supabase.channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, function(payload) {
                    appendMessage(payload.new);
                    var chatBox = document.getElementById('chat-messages');
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .subscribe();

            setInterval(async function() {
                var res = await supabase.from('messages').select('*').order('created_at', { ascending: true });
                if (res.data) {
                    var chatBox = document.getElementById('chat-messages');
                    if (res.data.length !== chatBox.children.length) {
                        loadMessages();
                    }
                }
            }, 3000);
        }

        async function sendMessage(mediaUrl) {
            var input = document.getElementById('msgInput');
            var text = input.value.trim();
            if (!text && !mediaUrl) return;

            var res = await supabase.from('messages').insert([{
                user_email: currentUsername,
                avatar_url: currentUserAvatar || null,
                content: text,
                image_url: mediaUrl || null
            }]).select();

            if (res.error) {
                alert("Mesaj gönderilemedi! Hata: " + res.error.message);
            } else {
                input.value = '';
                if (res.data && res.data[0]) {
                    appendMessage(res.data[0]);
                    var chatBox = document.getElementById('chat-messages');
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }
        }

        async function uploadFile(inputElement) {
            var file = inputElement.files[0];
            if (!file) return;

            var indicator = document.getElementById('uploadStatus');
            indicator.style.display = 'inline';

            var fileName = 'media_' + Date.now() + '_' + file.name;
            var uploadRes = await supabase.storage.from('chat-images').upload(fileName, file);
            indicator.style.display = 'none';

            if (uploadRes.error) {
                alert("Yükleme hatası: " + uploadRes.error.message);
                return;
            }

            var urlRes = supabase.storage.from('chat-images').getPublicUrl(fileName);
            if (urlRes && urlRes.data) {
                sendMessage(urlRes.data.publicUrl);
            }
            inputElement.value = '';
        }

        function appendMessage(msg) {
            if (!msg.id) return;
            var existing = document.querySelector('[data-msg-id="' + msg.id + '"]');
            if (existing) return;

            var chatBox = document.getElementById('chat-messages');
            var isSelf = msg.user_email === currentUsername;
            
            var card = document.createElement('div');
            card.className = 'message-card ' + (isSelf ? 'self' : '');
            card.setAttribute('data-msg-id', msg.id);
            
            var dateObj = msg.created_at ? new Date(msg.created_at) : new Date();
            var timeStr = dateObj.toLocaleTimeString();
            
            var html = '';
            html += '<div class="msg-avatar">';
            if (msg.avatar_url) {
                html += '<img src="' + msg.avatar_url + '" alt="PP">';
            } else {
                html += msg.user_email.charAt(0).toUpperCase();
            }
            html += '</div>';

            html += '<div class="msg-content-wrapper">';
            html += '<div class="msg-meta"><span>' + msg.user_email + '</span><span>•</span><span>' + timeStr + '</span></div>';
            html += '<div class="msg-bubble">';
            
            if (msg.content) {
                html += '<div>' + escapeHtml(msg.content) + '</div>';
            }
            if (msg.image_url) {
                html += '<img src="' + msg.image_url + '" alt="Medya" onclick="window.open(this.src)">';
            }
            
            html += '</div></div>';
            card.innerHTML = html;
            chatBox.appendChild(card);
        }

        function openAdminPanel() {
            alert("Admin Paneli: Supabase veritabanındaki 'messages' tablosundan tüm mesajları doğrudan silebilir veya yönetebilirsin kanka!");
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        init();
    </script>
</body>
</html>
