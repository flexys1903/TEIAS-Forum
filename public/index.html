<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEİAŞ Quantum Core // Secure Comms</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050508;
            --surface: rgba(13, 15, 22, 0.75);
            --surface-hover: rgba(22, 26, 38, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(59, 130, 246, 0.4);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.04) 0%, transparent 40%); }

        /* --- AUTH OVERLAY (Fütüristik Giriş Ekranı) --- */
        #auth-modal { position: fixed; inset: 0; background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; z-index: 2000; animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .auth-container { width: 100%; max-width: 420px; padding: 40px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(59, 130, 246, 0.1); position: relative; overflow: hidden; }
        .auth-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, #3b82f6, #10b981); }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h1 { font-size: 1.8rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; margin-bottom: 8px; }
        .auth-header p { color: var(--text-muted); font-size: 0.9rem; }
        
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group input { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); padding: 14px 16px; border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); background: rgba(0, 0, 0, 0.6); }
        
        .btn-primary { width: 100%; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6); }
        .auth-switch { text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; transition: color 0.2s; }
        .auth-switch:hover { color: #fff; }

        /* --- APP CORE LAYOUT --- */
        .app-wrapper { display: flex; width: 100vw; height: 100vh; opacity: 0; transition: opacity 0.6s ease; }
        .app-wrapper.visible { opacity: 1; }

        /* Sidebar (Glass Panel) */
        .sidebar { width: 300px; background: var(--surface); backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        .brand-box { padding: 25px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); }
        .brand-logo { width: 42px; height: 42px; background: linear-gradient(135deg, #3b82f6, #10b981); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .brand-info h2 { font-size: 1.05rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .brand-info span { font-size: 0.75rem; color: var(--success); font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 4px; }
        .brand-info span::before { content: ''; width: 6px; height: 6px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); }

        .nav-section { padding: 20px 15px; flex: 1; overflow-y: auto; }
        .nav-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; padding-left: 10px; }
        .nav-item { padding: 12px 16px; border-radius: 10px; color: var(--text-muted); font-size: 0.92rem; font-weight: 500; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
        .nav-item:hover { background: var(--surface-hover); color: #fff; transform: translateX(4px); }
        .nav-item.active { background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), transparent); color: #fff; border-left: 3px solid var(--accent); }

        .user-footer { padding: 18px 20px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .user-meta { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 34px; height: 34px; background: #252836; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; color: var(--accent); border: 1px solid var(--border); }
        .user-name { font-size: 0.9rem; font-weight: 600; color: #fff; max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--danger); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .logout-btn:hover { background: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* Main Workspace */
        .workspace { flex: 1; display: flex; flex-direction: column; background: rgba(8, 10, 15, 0.6); position: relative; }
        .workspace-header { padding: 20px 30px; background: var(--surface); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .workspace-title h3 { font-size: 1.1rem; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
        .workspace-title p { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        /* Messages Feed */
        #chat-messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        
        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message-card { display: flex; gap: 16px; max-width: 80%; animation: messageAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .message-card.self { align-self: flex-end; flex-direction: row-reverse; }
        
        .msg-avatar { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent); flex-shrink: 0; font-size: 0.95rem; }
        .message-card.self .msg-avatar { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }

        .msg-content-wrapper { display: flex; flex-direction: column; gap: 4px; }
        .message-card.self .msg-content-wrapper { align-items: flex-end; }
        
        .msg-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 8px; font-family: 'JetBrains Mono', monospace; }
        .msg-bubble { background: var(--surface); border: 1px solid var(--border); padding: 14px 18px; border-radius: 16px; color: var(--text-main); font-size: 0.95rem; line-height: 1.5; box-shadow: 0 4px 20px rgba(0,0,0,0.2); word-break: break-word; }
        .message-card.self .msg-bubble { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-color: rgba(59, 130, 246, 0.4); color: #fff; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25); }

        .msg-bubble img { max-width: 320px; max-height: 240px; border-radius: 10px; margin-top: 10px; display: block; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.2s; }
        .msg-bubble img:hover { transform: scale(1.02); }

        /* Input Dock */
        .input-dock { padding: 24px 30px; background: var(--surface); backdrop-filter: blur(20px); border-top: 1px solid var(--border); }
        .input-box { display: flex; align-items: center; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border); border-radius: 16px; padding: 8px 12px; gap: 12px; transition: all 0.3s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
        .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow), inset 0 2px 4px rgba(0,0,0,0.4); }

        .attach-btn { background: transparent; border: none; color: var(--text-muted); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: all 0.2s; }
        .attach-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }

        .input-box input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 0.98rem; padding: 8px; }
        .input-box input[type="text"]::placeholder { color: rgba(148, 163, 184, 0.5); }

        .send-btn { background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; color: #fff; padding: 10px 22px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.5); }

        /* Upload Loader State */
        .uploading-indicator { font-size: 0.8rem; color: var(--accent); font-family: 'JetBrains Mono', monospace; padding: 0 10px; display: none; }

        /* Scrollbar Design */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media(max-width: 768px) {
            .sidebar { display: none; }
            .message-card { max-width: 90%; }
        }
    </style>
</head>
<body>

    <!-- AUTH MODAL -->
    <div id="auth-modal">
        <div class="auth-container">
            <div class="auth-header">
                <h1 id="auth-title">Oturum Aç</h1>
                <p id="auth-subtitle">TEİAŞ Quantum şifreli ağına bağlanın</p>
            </div>
            <div class="input-group">
                <input type="email" id="auth-email" placeholder="Kurumsal E-posta">
            </div>
            <div class="input-group">
                <input type="password" id="auth-password" placeholder="Erişim Şifresi">
            </div>
            <button class="btn-primary" onclick="handleAuth()" id="auth-btn">Sisteme Giriş Yap</button>
            <div class="auth-switch" onclick="toggleAuthMode()" id="auth-switch-text">Hesabın yok mu? Kayıt ol</div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="app-wrapper" id="appWrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="brand-box">
                <div class="brand-logo">⚡</div>
                <div class="brand-info">
                    <h2>TEİAŞ Core</h2>
                    <span>Canlı Ağ</span>
                </div>
            </div>
            <div class="nav-section">
                <div class="nav-label">İletişim Kanalları</div>
                <div class="nav-item active"># quantum-genel</div>
                <div class="nav-item"># sistem-mühendislik</div>
                <div class="nav-item"># medya-akışı</div>
            </div>
            <div class="user-footer">
                <div class="user-meta">
                    <div class="user-avatar" id="userAvatarSymbol">U</div>
                    <div class="user-name" id="userDisplayName">Bağlanıyor...</div>
                </div>
                <button class="logout-btn" onclick="logout()" title="Oturumu Kapat">⏻</button>
            </div>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <div class="workspace-header">
                <div class="workspace-title">
                    <h3># quantum-genel</h3>
                    <p>Güvenli Uçtan Uca İletişim Protokolü Aktif</p>
                </div>
            </div>

            <div id="chat-messages"></div>

            <div class="input-dock">
                <div class="input-box">
                    <label class="attach-btn" title="Medya / Dosya Gönder">
                        📎
                        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="uploadFile(this)">
                    </label>
                    <span class="uploading-indicator" id="uploadStatus">Yükleniyor...</span>
                    <input type="text" id="msgInput" placeholder="Quantum ağa mesaj ilet..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">İlet</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let supabase;
        let currentUser = null;
        let isSignUp = false;

        async function init() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                
                if (!config.SUPABASE_URL || !config.SUPABASE_KEY) {
                    alert("Sistem yapılandırma anahtarları eksik!");
                    return;
                }

                supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_KEY);

                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    setSessionUser(session.user);
                }
            } catch (err) {
                console.error("Başlatma hatası:", err);
            }
        }

        function setSessionUser(user) {
            currentUser = user;
            document.getElementById('auth-modal').style.display = 'none';
            const wrapper = document.getElementById('appWrapper');
            wrapper.classList.add('visible');
            
            const shortName = currentUser.email.split('@')[0];
            document.getElementById('userDisplayName').textContent = shortName;
            document.getElementById('userAvatarSymbol').textContent = shortName.charAt(0).toUpperCase();
            
            loadMessages();
            subscribeRealtime();
        }

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').textContent = isSignUp ? "Ağ Kaydı Oluştur" : "Oturum Aç";
            document.getElementById('auth-subtitle').textContent = isSignUp ? "Yeni bir kimlik protokolü tanımlayın" : "TEİAŞ Quantum şifreli ağına bağlanın";
            document.getElementById('auth-btn').textContent = isSignUp ? "Kaydı Tamamla" : "Sisteme Giriş Yap";
            document.getElementById('auth-switch-text').textContent = isSignUp ? "Zaten bir kimliğin var mı? Oturum aç" : "Hesabın yok mu? Kayıt ol";
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if(!email || !password) {
                alert("Lütfen tüm kimlik alanlarını doldurun kanka!");
                return;
            }

            if (isSignUp) {
                const { error } = await supabase.auth.signUp({ email, password });
                if(error) alert("Kayıt Hatası: " + error.message);
                else {
                    alert("Kayıt başarıyla oluşturuldu! Şimdi giriş yapabilirsin.");
                    toggleAuthMode();
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if(error) {
                    alert("Giriş Hatası: " + error.message);
                } else {
                    setSessionUser(data.user);
                }
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function loadMessages() {
            const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
            if (error) return console.error(error);
            
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            if(data) {
                data.forEach(msg => appendMessage(msg));
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function subscribeRealtime() {
            supabase.channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    appendMessage(payload.new);
                    const chatBox = document.getElementById('chat-messages');
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .subscribe();
        }

        async function sendMessage(mediaUrl = null) {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text && !mediaUrl) return;

            const namePart = currentUser.email.split('@')[0];

            const { error } = await supabase.from('messages').insert([{
                user_email: namePart,
                content: text,
                image_url: mediaUrl
            }]);

            if (error) {
                alert("İleti gönderilemedi: " + error.message);
            } else {
                input.value = '';
            }
        }

        async function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;

            const indicator = document.getElementById('uploadStatus');
            indicator.style.display = 'inline';

            const fileName = `quantum_${Date.now()}_${file.name}`;
            const { data, error } = await supabase.storage.from('chat-images').upload(fileName, file);

            indicator.style.display = 'none';

            if (error) {
                alert("Medya aktarım hatası: " + error.message);
                return;
            }

            const { data: publicURL } = supabase.storage.from('chat-images').getPublicUrl(fileName);
            sendMessage(publicURL.publicUrl);
            input.value = '';
        }

        function appendMessage(msg) {
            const chatBox = document.getElementById('chat-messages');
            const isSelf = currentUser && msg.user_email === currentUser.email.split('@')[0];
            
            const card = document.creat
