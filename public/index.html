<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEİAŞ Chat Platformu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #1e1e1e; padding: 15px 20px; border-bottom: 1px solid #2d2d2d; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; color: #ffffff; letter-spacing: 1px; }
        .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; padding: 20px; overflow: hidden; }
        #chat-messages { flex: 1; overflow-y: auto; background: #181818; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #2d2d2d; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #252525; padding: 10px 14px; border-radius: 6px; max-width: 75%; word-break: break-word; }
        .message.user { background: #2d3748; align-self: flex-end; }
        .input-area { display: flex; gap: 10px; background: #1e1e1e; padding: 10px; border-radius: 8px; border: 1px solid #2d2d2d; }
        .input-area input { flex: 1; background: #121212; border: 1px solid #333; border-radius: 4px; padding: 10px; color: #fff; outline: none; }
        .input-area input:focus { border-color: #555; }
        .input-area button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .input-area button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <header>
        <h1>🦅 TEİAŞ Chat Odası</h1>
        <span id="status" style="font-size: 0.85rem; color: #10b981;">● Bağlandı</span>
    </header>

    <div class="chat-container">
        <div id="chat-messages">
            <div class="message">Sisteme hoş geldin kanka! Sohbet altyapısı aktif.</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Mesajını yaz..." autofocus>
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(!text) return;

            const chatBox = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
