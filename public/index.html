<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEİAŞ Quantum Core // Secure Comms</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050508;
            --surface: #0d0f16;
            --surface-hover: #161a26;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --admin-gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        /* --- AUTH MODAL & DYNAMIC CARD --- */
        #auth-modal { position: fixed; inset: 0; background: #050508; display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .auth-container { width: 100%; max-width: 420px; padding: 30px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9); position: relative; overflow: hidden; }
        .auth-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, #3b82f6, #10b981); }
        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-header h1 { font-size: 1.6rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .auth-header p { color: var(--text-muted); font-size: 0.85rem; }
        
        .input-group { margin-bottom: 16px; }
        .input-group input { width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border); padding: 14px 16px; border-radius: 12px; color: #fff; font-size: 1rem; outline: none; }
        .input-group input:focus { border-color: var(--accent); }
        
        .btn-primary { width: 100%; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 5px; }
        
        .auth-switch-btn { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); color: var(--text-muted); padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 500; cursor: pointer; margin-top: 20px; text-align: center; display: block; }
        .auth-switch-btn:active { background: rgba(59, 130, 246, 0.2); color: #fff; border-color: var(--accent); }

        /* --- APP CORE --- */
        .app-wrapper { display: flex; width: 100vw; height: 100vh; opacity: 0; transition: opacity 0.4s ease; }
        .app-wrapper.visible { opacity: 1; }

        .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        .brand-box { padding: 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .brand-logo { width: 38px; height: 38px; background: linear-gradient(135deg, #3b82f6, #10b981); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .brand-info h2 { font-size: 1rem; font-weight: 700; color: #fff; }
        .brand-info span { font-size: 0.7rem; color: var(--success); font-family: 'JetBrains Mono', monospace; }
        
        .nav-section { padding: 15px; flex: 1; overflow-y: auto; }
        .nav-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; padding-left: 8px; }
        .nav-item { padding: 10px 14px; border-radius: 8px; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .nav-item.active { background: rgba(59, 130, 246, 0.15); color: #fff; border-left: 3px solid var(--accent); }

        .admin-panel-btn { margin: 15px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: var(--admin-gold); padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: none; text-align: center; }

        .user-footer { padding: 15px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .user-meta { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: #252836; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: var(--accent); }
        .user-name { font-size: 0.85rem; font-weight: 600; color: #fff; max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--danger); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg-deep); position: relative; }
        .workspace-header { padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .workspace-title h3 { font-size: 1rem; font-weight: 600; color: #fff; }
        .workspace-title p { font-size: 0.75rem; color: var(--text-muted); }

        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message-card { display: flex; gap: 12px; max-width: 85%; }
        .message-card.self { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 10px; background: #1e293b; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent); flex-shrink: 0; font-size: 0.85rem; }
        .message-card.self .msg-avatar { background: #2563eb; color: #fff; }
        .msg-content-wrapper { display: flex; flex-direction: column; gap: 4px; }
        .message-card.self .msg-content-wrapper { align-items: flex-end; }
        .msg-meta { font-size: 0.7rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        .msg-bubble { background: var(--surface); border: 1px solid var(--border); padding: 12px 16px; border-radius: 14px; color: var(--text-main); font-size: 0.9rem; word-break: break-word; }
        .message-card.self .msg-bubble { background: #2563eb; color: #fff; }
        .msg-bubble img { max-width: 260px; max-height: 200px; border-radius: 8px; margin-top: 8px; display: block; }

        .input-dock { padding: 16px 20px; background: var(--surface); border-top: 1px solid var(--border); }
        .input-box { display: flex; align-items: center; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 14px; padding: 6px 10px; gap: 10px; }
        .attach-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; }
        .input-box input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 0.95rem; padding: 6px; }
        .send-btn { background: #2563eb; border: none; color: #fff; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .uploading-indicator { font-size: 0.75rem; color: var(--accent); display: none; font-family: 'JetBrains Mono', monospace; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <!-- AUTH MODAL (v7) -->
    <div id="auth-modal">
        <div class="auth-container" id="auth-card">
            <!-- Dinamik doldurulacak -->
        </div>
    </div>

    <!-- APP WRAPPER -->
    <div class="app-wrapper" id="appWrapper">
        <div class="sidebar">
            <div class="brand-box">
                <div class="brand-logo">⚡</div>
                <div class="brand-info">
                    <h2>TEİAŞ Core</h2>
                    <span>Canlı Ağ</span>
                </div>
            </div>
            <div class="nav-section">
                <div class="nav-label">Kanallar</div>
                <div class="nav-item active"># quantum-genel</div>
            </div>
            
            <div id="adminBtn" class="admin-panel-btn" onclick="openAdminPanel()">⚙️ Admin Paneli</div>

            <div class="user-footer">
                <div class="user-meta">
                    <div class="user-avatar" id="userAvatarSymbol">U</div>
                    <div class="user-name" id="userDisplayName">Bağlanıyor...</div>
                </div>
                <button class="logout-btn" onclick="logout()" title="Çıkış Yap">⏻</button>
            </div>
        </div>

        <div class="workspace">
            <div class="workspace-header">
                <div class="workspace-title">
                    <h3># quantum-genel</h3>
                    <p>Uçtan uca şifreli kanal</p>
                </div>
            </div>

            <div id="chat-messages"></div>

            <div class="input-dock">
                <div class="input-box">
                    <label class="attach-btn" title="Resim Yükle">
                        📎
                        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="uploadFile(this)">
                    </label>
                    <span class="uploading-indicator" id="uploadStatus">Yükleniyor...</span>
                    <input type="text" id="msgInput" placeholder="Mesajını ilet..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">İlet</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let supabase;
        let currentUser = null;
        let isLoginMode = true; 
        const ADMIN_USERNAME = "utku"; 

        async function init() {
            renderAuthCard();
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_KEY);

                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    setSessionUser(session.user);
                }
            } catch (err) {
                console.error("Init error:", err);
            }
        }

        function renderAuthCard() {
            const card = document.getElementById('auth-card');
            if (isLoginMode) {
                card.innerHTML = `
                    <div class="auth-header">
                        <h1>Giriş Yap</h1>
                        <p>TEİAŞ Quantum Ağına Bağlan (v7)</p>
                    </div>
                    <div class="input-group">
                        <input type="text" id="auth-username" placeholder="Hesap İsmi (Kullanıcı Adı)" autocapitalize="none">
                    </div>
                    <div class="input-group">
                        <input type="password" id="auth-password" placeholder="Şifre">
                    </div>
                    <button class="btn-primary" onclick="handleAuthAction()">Giriş Yap</button>
                    
                    <button type="button" class="auth-switch-btn" onclick="toggleMode()">
                        Hesabın yok mu? Kayıt ol ⚡
                    </button>
                `;
            } else {
                card.innerHTML = `
                    <div class="auth-header">
                        <h1>Hesap Oluştur</h1>
                        <p>Yeni bir hesap ismi ve şifre belirle (v7)</p>
                    </div>
                    <div class="input-group">
                        <input type="text" id="auth-username" placeholder="Hesap İsmi (Kullanıcı Adı)" autocapitalize="none">
                    </div>
                    <div class="input-group">
                        <input type="password" id="auth-password" placeholder="Şifre">
                    </div>
                    <button class="btn-primary" onclick="handleAuthAction()">Kayıt Ol ve Başla</button>
                    
                    <button type="button" class="auth-switch-btn" onclick="toggleMode()">
                        Zaten hesabın var mı? Giriş yap ⚡
                    </button>
                `;
            }
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            renderAuthCard();
        }

        async function handleAuthAction() {
            const username = document.getElementById('auth-username').value.trim().toLowerCase();
            const password = document.getElementById('auth-password').value.trim();

            if(!username || !password) {
                alert("Kullanıcı adı ve şifreni eksiksiz gir kanka!");
                return;
            }

            if (isLoginMode) {
                const { data, error } = await supabase.auth.signInWithPassword({ 
                    email: `${username}@teias.local`, 
                    password: password 
                });

                if(error) {
                    alert("Giriş Hatası: Hesap ismi veya şifre hatalı!");
                } else {
                    setSessionUser(data.user);
                }
            } else {
                const { data, error } = await supabase.auth.signUp({ 
                    email: `${username}@teias.local`, 
                    password: password 
                });

                if(error) {
                    alert("Kayıt Hatası: " + error.message);
                } else {
                    alert("Hesabın başarıyla oluşturuldu! Şimdi giriş yapabilirsin.");
                    isLoginMode = true;
                    renderAuthCard();
                }
            }
        }

        function setSessionUser(user) {
            currentUser = user;
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('appWrapper').classList.add('visible');
            
            const username = currentUser.email.split('@')[0];
            document.getElementById('userDisplayName').textContent = username;
            document.getElementById('userAvatarSymbol').textContent = username.charAt(0).toUpperCase();
            
            if (username.toLowerCase() === ADMIN_USERNAME.toLowerCase()) {
                document.getElementById('adminBtn').style.display = 'block';
            }

            loadMessages();
            subscribeRealtime();
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function loadMessages() {
            const { data, error } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
            if (error) return;
            
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = ``;
            if(data) data.forEach(msg => appendMessage(msg));
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function subscribeRealtime() {
            supabase.channel('public:messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    appendMessage(payload.new);
                    const chatBox = document.getElementById('chat-messages');
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .subscribe();
        }

        async function sendMessage(mediaUrl = null) {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text && !mediaUrl) return;

            const username = currentUser.email.split('@')[0];

            const { error } = await supabase.from('messages').insert([{
                user_email: username,
                content: text,
                image_url: mediaUrl
            }]);

            if (!error) input.value = '';
        }

        async function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;

            const indicator = document.getElementById('uploadStatus');
            indicator.style.display = 'inline';

            const fileName = `media_${Date.now()}_${file.name}`;
            const { data, error } = await supabase.storage.from('chat-images').upload(fileName, file);
            indicator.style.display = 'none';

            if (error) {
                alert("Yükleme hatası: " + error.message);
                return;
            }

            const { data: publicURL } = supabase.storage.from('chat-images').getPublicUrl(fileName);
            sendMessage(publicURL.publicUrl);
            input.value = '';
        }

        function appendMessage(msg) {
            const chatBox = document.getElementById('chat-messages');
            const currentUsername = currentUser ? currentUser.email.split('@')[0] : '';
            const isSelf = msg.user_email === currentUsername;
            
            const card = document.createElement('div');
            card.className = `message-card ${isSelf ? 'self' : ''}`;
            
            const timeStr = new Date(msg.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            let html = `
                <div class="msg-avatar">${msg.user_email.charAt(0).toUpperCase()}</div>
                <div class="msg-content-wrapper">
                    <div class="msg-meta">
                        <span>${msg.user_email}</span>
                        <span>•</span>
                        <span>${timeStr}</span>
                    </div>
                    <div class="msg-bubble">
            `;
            
            if (msg.content) html += `<div>${escapeHtml(msg.content)}</div>`;
            if (msg.image_url) html += `<img src="${msg.image_url}" alt="Medya" onclick="window.open(this.src)">`;
            
            html += `</div></div>`;
            card.innerHTML = html;
            chatBox.appendChild(card);
        }

        function openAdminPanel() {
            alert("Admin Paneli: Supabase veritabanındaki 'messages' tablosundan tüm mesajları doğrudan silebilir veya yönetebilirsin kanka!");
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        init();
    </script>
</body>
</html>
