<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohbet Odası</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex animate-fade">

  <!-- Sol Kenar Çubuğu (Kanallar/Sunucu) -->
  <div class="w-64 bg-[#1E1F22] flex flex-col justify-between p-4 border-r border-[#383A3F]">
    <div>
      <h1 class="text-xl font-bold text-[#D7CCC8] mb-6 tracking-wide">KaraKartal Chat</h1>
      <div class="space-y-1">
        <div class="p-2 rounded-md bg-[#383A3F] text-[#F4F1EA] font-medium cursor-pointer"># genel-sohbet</div>
        <div class="p-2 rounded-md text-[#949BA4] hover:bg-[#35373C] hover:text-[#F4F1EA] cursor-pointer transition"># medya-paylasim</div>
      </div>
    </div>
    <button id="logoutBtn" class="text-sm text-[#949BA4] hover:text-red-400 text-left transition">Çıkış Yap</button>
  </div>

  <!-- Ana Sohbet Alanı -->
  <div class="flex-1 flex flex-col bg-[#2C2D30]">
    <!-- Üst Başlık -->
    <div class="h-14 border-b border-[#383A3F] flex items-center px-6 shadow-sm">
      <span class="font-semibold text-[#F4F1EA]"># genel-sohbet</span>
    </div>

    <!-- Mesaj Akışı -->
    <div id="messageContainer" class="flex-1 p-6 overflow-y-auto space-y-4">
      <!-- Mesajlar dinamik olarak buraya gelecek -->
    </div>

    <!-- Mesaj Gönderme Kutusu -->
    <div class="p-4 bg-[#2C2D30]">
      <form id="messageForm" class="flex items-center bg-[#383A3F] rounded-lg p-2 gap-3">
        <label class="cursor-pointer text-[#D7CCC8] hover:text-white px-2">
          📎
          <input type="file" id="mediaInput" accept="image/*,video/*" class="hidden">
        </label>
        <input type="text" id="messageInput" placeholder="#genel-sohbet kanalına mesaj gönder..." class="flex-1 bg-transparent text-[#F4F1EA] focus:outline-none placeholder-[#949BA4]">
        <button type="submit" class="btn-beige px-4 py-2 rounded-md text-sm">Gönder</button>
      </form>
      <div id="videoWarning" class="text-xs text-amber-300 mt-1 hidden">⚠️ Videolar en fazla 20 saniye olmalıdır!</div>
    </div>
  </div>

  <!-- Supabase Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
